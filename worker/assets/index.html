<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>IPTV 管理</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f7;
      --card: rgba(255,255,255,.72);
      --fg: #1d1d1f;
      --sub: #6e6e73;
      --accent: #0071e3;
      --radius: 18px;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #000; --card: rgba(28,28,30,.72); --fg: #f5f5f7; --sub: #98989d; }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
      background: var(--bg); color: var(--fg);
      min-height: 100vh; padding: max(24px, env(safe-area-inset-top)) 20px 40px;
    }
    h1 { font-size: 34px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 4px; }
    .sub { color: var(--sub); margin-bottom: 24px; font-size: 15px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
    .card {
      background: var(--card); backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-radius: var(--radius); padding: 18px;
      border: 1px solid rgba(120,120,128,.12);
    }
    .card .num { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
    .card .label { color: var(--sub); font-size: 13px; margin-top: 4px; }
    .links { margin-top: 28px; display: flex; gap: 12px; flex-wrap: wrap; }
    .links a {
      color: var(--accent); text-decoration: none; font-size: 15px;
      background: var(--card); padding: 10px 18px; border-radius: 999px;
      border: 1px solid rgba(120,120,128,.12);
    }
    pre {
      margin-top: 28px; background: var(--card); border-radius: var(--radius);
      padding: 16px; font-size: 12px; overflow-x: auto; color: var(--sub);
    }
  </style>
</head>
<body>
  <h1>IPTV 管理</h1>
  <div class="sub">Phase 0 占位页 · iOS 风格前端将在 Phase 6 接入</div>
  <div class="cards" id="cards">
    <div class="card"><div class="num">-</div><div class="label">活跃线路</div></div>
    <div class="card"><div class="num">-</div><div class="label">有效线路</div></div>
    <div class="card"><div class="num">-</div><div class="label">频道数</div></div>
  </div>
  <div class="links">
    <a href="/iptv.m3u">订阅 M3U</a>
    <a href="/iptv.txt">订阅 TXT</a>
    <a href="/iptv.json">订阅 JSON</a>
  </div>
  <pre id="runs">加载运行记录…</pre>
  <script>
    fetch('/api/v1/status').then(r => r.json()).then(d => {
      const c = d.counts || {};
      const nums = document.querySelectorAll('.card .num');
      nums[0].textContent = c.entries_active ?? '-';
      nums[1].textContent = c.entries_ok ?? '-';
      nums[2].textContent = c.channels ?? '-';
      document.getElementById('runs').textContent =
        (d.runs || []).map(x => `${x.ts}  ${x.kind}  ${x.status}`).join('\n');
    });
  </script>
</body>
</html>
